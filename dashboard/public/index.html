<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ouroboros</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="icon.svg" alt="" width="22" height="22">
      <span>Ouroboros</span>
      <span class="phase" id="phase"></span>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="overview" aria-selected="true">Overview</button>
      <button role="tab" data-tab="learnings" aria-selected="false">Learnings</button>
      <button role="tab" data-tab="inventory" aria-selected="false">Inventory</button>
      <button role="tab" data-tab="health" aria-selected="false">Health</button>
    </nav>
    <div class="top-actions">
      <label class="range">
        <span class="sr-only">Period</span>
        <select id="range">
          <option value="7">Last 7 days</option>
          <option value="30" selected>Last 30 days</option>
          <option value="90">Last 90 days</option>
        </select>
      </label>
      <button id="theme" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">◐</button>
    </div>
  </header>
  <main id="view" aria-live="polite"></main>
  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <script src="app.js" type="module"></script>
</body>
</html>
