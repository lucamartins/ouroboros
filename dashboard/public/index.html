<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ouroboros</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="#inbox" aria-label="Ouroboros home">
        <img src="icon.svg" alt="" width="22" height="22">
        <span class="brand-name">Ouroboros</span>
        <span class="brand-meta" id="status"></span>
      </a>
      <nav class="tabs" aria-label="Sections">
        <a href="#inbox" data-tab="inbox">Inbox <span class="count" id="inbox-count" hidden></span></a>
        <a href="#overview" data-tab="overview">Overview</a>
        <a href="#knowledge" data-tab="knowledge">Knowledge</a>
        <a href="#activity" data-tab="activity">Activity</a>
        <a href="#system" data-tab="system">System</a>
      </nav>
      <div class="top-actions">
        <label class="range" id="range-wrap" hidden>
          <span class="sr-only">Period</span>
          <select id="range">
            <option value="7">Last 7 days</option>
            <option value="30" selected>Last 30 days</option>
            <option value="90">Last 90 days</option>
          </select>
        </label>
        <button id="theme" class="btn icon quiet" type="button" aria-label="Switch to dark theme" title="Switch theme"></button>
      </div>
    </div>
  </header>
  <main id="view" tabindex="-1"></main>
  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js" type="module"></script>
</body>
</html>
